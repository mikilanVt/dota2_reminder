name: Prepare hero source data and static images

on:
  push:
    branches: [codex/hero-library]
    paths:
      - .github/workflows/prepare-heroes.yml
      - scripts/import-heroes.mjs
      - scripts/prepare-hero-images.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prepare-heroes
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build-time image converter
        run: python -m pip install Pillow==12.3.0
      - name: Download and validate official hero data
        run: node scripts/import-heroes.mjs --patch=7.41f
      - name: Optimize static artwork
        run: python scripts/prepare-hero-images.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hero-source-and-images
          path: |
            data-sources/valve-heroes-*.json.gz
            data-sources/hero-images.json
            src/data/hero-catalog.json
            public/assets/heroes
          if-no-files-found: error
          retention-days: 7
